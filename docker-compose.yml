services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: tickets, POSTGRES_USER: tickets, POSTGRES_PASSWORD: tickets }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tickets:tickets@postgres:5432/tickets?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:5173
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
  frontend:
    build: ./frontend
    environment: { VITE_API_URL: http://localhost:3000 }
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { pgdata: {} }
